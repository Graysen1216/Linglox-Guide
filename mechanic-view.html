<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mechanic - Linglox Companion</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
            margin-bottom: 0;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .hero {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .color-preview {
            width: 100%;
            height: 18px;
            border-radius: 9px;
            margin-bottom: 22px;
            border: 1px solid rgba(
                255,
                255,
                255,
                0.2
            );
            box-sizing: border-box;
        }

        .hero h1 {
            margin: 0 0 10px 0;
            font-size: 34px;
        }

        .theme {
            color: #8ed8e5;
            font-size: 16px;
        }

        .type {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #29454d;
            color: #c7d8dc;
            font-size: 13px;
        }

        .section {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 18px;
        }

        .section h2 {
            margin-top: 0;
            color: #8ed8e5;
        }

        .section p {
            color: #d0dde0;
            line-height: 1.7;
            margin-bottom: 0;
        }

        .section + .section {
            margin-top: 0;
        }

        .variant {
            background: #1b3037;
            border: 1px solid #29454d;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }

        .variant:first-child {
            margin-top: 0;
        }

        .variant h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 21px;
        }

        .variant-color {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid rgba(
                255,
                255,
                255,
                0.15
            );
            box-sizing: border-box;
        }

        .variant-section {
            margin-top: 18px;
        }

        .variant-section:first-of-type {
            margin-top: 0;
        }

        .variant-section h4 {
            color: #8ed8e5;
            margin: 0 0 6px 0;
            font-size: 15px;
        }

        .variant-section p {
            margin: 0;
        }

        .error {
            background: #3d2529;
            border: 1px solid #70454b;
            border-radius: 10px;
            padding: 20px;
            color: #ffb0b0;
        }

        .description {
            white-space: pre-line;
        }

        .notes {
            color: #9fb5ba !important;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 32px;
            }

            main {
                padding: 30px 15px;
            }

            .hero {
                padding: 20px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .section {
                padding: 20px;
            }

            .variant {
                padding: 17px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1 id="title">
        Loading...
    </h1>

    <p>
        Linglox Companion
    </p>

</header>


<main>


    <a
        class="back"
        href="mechanics.html"
    >
        ← Back to mechanics
    </a>


    <div id="content">

        <div class="section">
            Loading mechanic...
        </div>

    </div>


</main>


<script src="js/mechanics.js"></script>


<script>

    const title =
        document.getElementById(
            "title"
        );


    const content =
        document.getElementById(
            "content"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const name =
        params.get("name");


    function escapeHTML(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function displayValue(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "N/A";

        }


        return escapeHTML(
            value
        );

    }


    function createHeightSection(
        titleText,
        value
    ) {

        return `

            <div class="section">

                <h2>
                    ${titleText}
                </h2>

                <p>
                    ${displayValue(
                        value
                    )}
                </p>

            </div>

        `;

    }


    function createVariant(
        variant
    ) {

        return `

            <div class="variant">

                ${
                    variant.color
                        ? `

                            <div
                                class="variant-color"
                                style="
                                    background:${escapeHTML(
                                        variant.color
                                    )};
                                "
                            ></div>

                        `
                        : ""
                }


                <h3>
                    ${escapeHTML(
                        variant.name
                    )}
                </h3>


                ${createVariantHeight(
                    "High",
                    variant.high
                )}


                ${createVariantHeight(
                    "Middle",
                    variant.middle
                )}


                ${createVariantHeight(
                    "Low",
                    variant.low
                )}


                ${
                    variant.checker
                        ? createVariantHeight(
                            "Checker",
                            variant.checker
                        )
                        : ""
                }

            </div>

        `;

    }


    function createVariantHeight(
        titleText,
        value
    ) {

        return `

            <div class="variant-section">

                <h4>
                    ${titleText}
                </h4>

                <p>
                    ${displayValue(
                        value
                    )}
                </p>

            </div>

        `;

    }


    function findEntry(
        requestedName
    ) {

        const colorMatch =
            typeof mechanics !== "undefined"
                ? mechanics.find(
                    item =>
                        item.name ===
                        requestedName
                )
                : null;


        if (colorMatch) {

            return {
                entry: colorMatch,
                type: "color"
            };

        }


        const materialMatch =
            typeof materials !== "undefined"
                ? materials.find(
                    item =>
                        item.name ===
                        requestedName
                )
                : null;


        if (materialMatch) {

            return {
                entry: materialMatch,
                type: "material"
            };

        }


        /*
         * Also allow URLs to point directly
         * at a material variant.
         *
         * Example:
         * mechanic-view.html?name=Fabric
         *
         * will show Fabric itself, while
         * ?name=Dark%20Taupe%20Fabric
         * will show that specific variant.
         */

        if (
            typeof materials !== "undefined"
        ) {

            for (
                const material of materials
            ) {

                if (
                    !Array.isArray(
                        material.variants
                    )
                ) {

                    continue;

                }


                const variant =
                    material.variants.find(
                        item =>
                            item.name ===
                            requestedName
                    );


                if (variant) {

                    return {
                        entry: variant,
                        type: "variant",
                        parent: material
                    };

                }

            }

        }


        return null;

    }


    if (!name) {

        title.textContent =
            "Mechanic Not Found";


        content.innerHTML = `

            <div class="error">

                No mechanic was specified.

            </div>

        `;

    } else {

        const result =
            findEntry(
                name
            );


        if (!result) {

            title.textContent =
                "Mechanic Not Found";


            content.innerHTML = `

                <div class="error">

                    Could not find the mechanic:

                    <br><br>

                    <strong>
                        ${escapeHTML(
                            name
                        )}
                    </strong>

                </div>

            `;

        } else {

            const mechanic =
                result.entry;


            title.textContent =
                mechanic.name;


            let html = "";


            /*
             * COLOR MECHANIC
             */

            if (
                result.type === "color"
            ) {

                html = `

                    <div class="hero">

                        ${
                            mechanic.color
                                ? `

                                    <div
                                        class="color-preview"
                                        style="
                                            background:${escapeHTML(
                                                mechanic.color
                                            )};
                                        "
                                    ></div>

                                `
                                : ""
                        }


                        <h1>
                            ${escapeHTML(
                                mechanic.name
                            )}
                        </h1>


                        ${
                            mechanic.theme
                                ? `

                                    <div class="theme">

                                        Theme:
                                        ${escapeHTML(
                                            mechanic.theme
                                        )}

                                    </div>

                                `
                                : ""
                        }


                        <div class="type">
                            Color Mechanic
                        </div>

                    </div>


                    ${createHeightSection(
                        "High",
                        mechanic.high
                    )}


                    ${createHeightSection(
                        "Middle",
                        mechanic.middle
                    )}


                    ${createHeightSection(
                        "Low",
                        mechanic.low
                    )}


                    ${createHeightSection(
                        "Checker",
                        mechanic.checker
                    )}

                `;

            }


            /*
             * MATERIAL WITH VARIANTS
             */

            else if (
                result.type === "material" &&
                Array.isArray(
                    mechanic.variants
                )
            ) {

                html = `

                    <div class="hero">

                        <h1>
                            ${escapeHTML(
                                mechanic.name
                            )}
                        </h1>


                        <div class="type">
                            Material
                        </div>

                    </div>


                    ${
                        mechanic.description
                            ? `

                                <div class="section">

                                    <h2>
                                        Description
                                    </h2>

                                    <p class="description">

                                        ${escapeHTML(
                                            mechanic.description
                                        )}

                                    </p>

                                </div>

                            `
                            : ""
                    }


                    <div class="section">

                        <h2>
                            Variants
                        </h2>


                        ${mechanic.variants
                            .map(
                                variant =>
                                    createVariant(
                                        variant
                                    )
                            )
                            .join("")}

                    </div>

                `;

            }


            /*
             * NORMAL MATERIAL
             */

            else if (
                result.type === "material"
            ) {

                html = `

                    <div class="hero">

                        ${
                            mechanic.color
                                ? `

                                    <div
                                        class="color-preview"
                                        style="
                                            background:${escapeHTML(
                                                mechanic.color
                                            )};
                                        "
                                    ></div>

                                `
                                : ""
                        }


                        <h1>
                            ${escapeHTML(
                                mechanic.name
                            )}
                        </h1>


                        ${
                            mechanic.theme
                                ? `

                                    <div class="theme">

                                        Theme:
                                        ${escapeHTML(
                                            mechanic.theme
                                        )}

                                    </div>

                                `
                                : ""
                        }


                        <div class="type">
                            Material
                        </div>

                    </div>


                    ${
                        mechanic.description
                            ? `

                                <div class="section">

                                    <h2>
                                        Description
                                    </h2>

                                    <p class="description">

                                        ${escapeHTML(
                                            mechanic.description
                                        )}

                                    </p>

                                </div>

                            `
                            : ""
                    }


                    ${
                        mechanic.theme
                            ? `

                                <div class="section">

                                    <h2>
                                        Theme
                                    </h2>

                                    <p>
                                        ${escapeHTML(
                                            mechanic.theme
                                        )}
                                    </p>

                                </div>

                            `
                            : ""
                    }


                    ${
                        mechanic.high !== undefined
                            ? createHeightSection(
                                "High",
                                mechanic.high
                            )
                            : ""
                    }


                    ${
                        mechanic.middle !== undefined
                            ? createHeightSection(
                                "Middle",
                                mechanic.middle
                            )
                            : ""
                    }


                    ${
                        mechanic.low !== undefined
                            ? createHeightSection(
                                "Low",
                                mechanic.low
                            )
                            : ""
                    }


                    ${
                        mechanic.checker !== undefined
                            ? createHeightSection(
                                "Checker",
                                mechanic.checker
                            )
                            : ""
                    }


                    ${
                        mechanic.notes
                            ? `

                                <div class="section">

                                    <h2>
                                        Notes
                                    </h2>

                                    <p class="notes">

                                        ${escapeHTML(
                                            mechanic.notes
                                        )}

                                    </p>

                                </div>

                            `
                            : ""
                    }

                `;

            }


            /*
             * INDIVIDUAL MATERIAL VARIANT
             */

            else if (
                result.type === "variant"
            ) {

                html = `

                    <div class="hero">

                        ${
                            mechanic.color
                                ? `

                                    <div
                                        class="color-preview"
                                        style="
                                            background:${escapeHTML(
                                                mechanic.color
                                            )};
                                        "
                                    ></div>

                                `
                                : ""
                        }


                        <h1>
                            ${escapeHTML(
                                mechanic.name
                            )}
                        </h1>


                        <div class="theme">

                            Variant of
                            ${escapeHTML(
                                result.parent.name
                            )}

                        </div>


                        <div class="type">
                            Material Variant
                        </div>

                    </div>


                    ${createHeightSection(
                        "High",
                        mechanic.high
                    )}


                    ${createHeightSection(
                        "Middle",
                        mechanic.middle
                    )}


                    ${createHeightSection(
                        "Low",
                        mechanic.low
                    )}


                    ${
                        mechanic.checker !== undefined
                            ? createHeightSection(
                                "Checker",
                                mechanic.checker
                            )
                            : ""
                    }

                `;

            }


            content.innerHTML =
                html;

        }

    }

</script>


</body>

</html>
