<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mechanic - Linglox Companion</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .hero {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .color-preview {
            width: 100%;
            height: 18px;
            border-radius: 9px;
            margin-bottom: 22px;
            border: 1px solid rgba(
                255,
                255,
                255,
                0.2
            );
            box-sizing: border-box;
        }

        .hero h1 {
            margin: 0 0 10px 0;
            font-size: 34px;
        }

        .theme {
            color: #8ed8e5;
            font-size: 16px;
        }

        .section {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 18px;
        }

        .section h2 {
            margin-top: 0;
            color: #8ed8e5;
        }

        .section p {
            color: #d0dde0;
            line-height: 1.7;
            margin-bottom: 0;
        }

        .error {
            background: #3d2529;
            border: 1px solid #70454b;
            border-radius: 10px;
            padding: 20px;
            color: #ffb0b0;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 32px;
            }

            main {
                padding: 30px 15px;
            }

            .hero {
                padding: 20px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .section {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1 id="title">
        Loading...
    </h1>

    <p>
        Linglox Companion
    </p>

</header>


<main>


    <a
        class="back"
        href="mechanics.html"
    >
        ← Back to mechanics
    </a>


    <div id="content">

        <div class="section">
            Loading mechanic...
        </div>

    </div>


</main>


<script src="js/mechanics.js"></script>


<script>

    const title =
        document.getElementById(
            "title"
        );


    const content =
        document.getElementById(
            "content"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const name =
        params.get("name");


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    if (!name) {

        title.textContent =
            "Mechanic Not Found";

        content.innerHTML =

            `<div class="error">

                No mechanic was specified.

            </div>`;

    } else {

        const mechanic =
            mechanics.find(
                item =>
                    item.name === name
            );


        if (!mechanic) {

            title.textContent =
                "Mechanic Not Found";

            content.innerHTML =

                `<div class="error">

                    Could not find the mechanic:

                    <br><br>

                    <strong>
                        ${escapeHTML(
                            name
                        )}
                    </strong>

                </div>`;

        } else {

            title.textContent =
                mechanic.name;


            content.innerHTML = `

                <div class="hero">

                    <div
                        class="color-preview"
                        style="background:${mechanic.color};"
                    ></div>

                    <h1>
                        ${escapeHTML(
                            mechanic.name
                        )}
                    </h1>

                    <div class="theme">

                        Theme:
                        ${escapeHTML(
                            mechanic.theme
                        )}

                    </div>

                </div>


                <div class="section">

                    <h2>
                        High
                    </h2>

                    <p>
                        ${escapeHTML(
                            mechanic.high
                        )}
                    </p>

                </div>


                <div class="section">

                    <h2>
                        Middle
                    </h2>

                    <p>
                        ${escapeHTML(
                            mechanic.middle
                        )}
                    </p>

                </div>


                <div class="section">

                    <h2>
                        Low
                    </h2>

                    <p>
                        ${escapeHTML(
                            mechanic.low
                        )}
                    </p>

                </div>


                <div class="section">

                    <h2>
                        Checker
                    </h2>

                    <p>
                        ${escapeHTML(
                            mechanic.checker
                        )}
                    </p>

                </div>

            `;

        }

    }

</script>


</body>

</html>
