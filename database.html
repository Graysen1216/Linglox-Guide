<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Database - Linglox Companion</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .search-box {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #101820;
            color: white;
            font-size: 16px;
        }

        .prompt {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 18px;
        }

        .prompt h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .answer {
            display: inline-block;
            background: #29454d;
            border-radius: 7px;
            padding: 7px 11px;
            margin-bottom: 15px;
        }

        .metadata {
            color: #b7c9cd;
            line-height: 1.8;
        }

        .label {
            color: white;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a8bcc1;
        }

        .error {
            background: #3d2529;
            border: 1px solid #70454b;
            border-radius: 10px;
            padding: 20px;
            color: #ffb0b0;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #a8bcc1;
        }

        .count {
            color: #a8bcc1;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>


<header>

    <h1>
        Prompt Database
    </h1>

    <p>
        Linglox Companion
    </p>

</header>


<main>


    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search prompts, answers, badges, areas..."
            autocomplete="off"
        >

    </div>


    <div
        id="count"
        class="count"
    >
        Loading...
    </div>


    <div id="results">

        <div class="loading">
            Loading prompts...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    /* =========================================
       SUPABASE
       ========================================= */


    const SUPABASE_URL =
        "https://njjqjvsoydazatafclwc.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_-ro-MLRQ47X2bYtPRZtrng_Kp17EZfi";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =========================================
       ELEMENTS
       ========================================= */


    const results =
        document.getElementById(
            "results"
        );


    const search =
        document.getElementById(
            "search"
        );


    const count =
        document.getElementById(
            "count"
        );


    let prompts = [];


    /* =========================================
       LOAD PROMPTS
       ========================================= */


    async function loadPrompts() {

        const {
            data,
            error
        } =
        await supabaseClient

            .from("prompts")

            .select("*")

            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (error) {

            results.innerHTML =

                `<div class="error">

                    <strong>
                        Could not load prompts.
                    </strong>

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>`;

            count.textContent =
                "";

            return;

        }


        prompts =
            data || [];


        displayPrompts(
            prompts
        );

    }


    /* =========================================
       DISPLAY PROMPTS
       ========================================= */


    function displayPrompts(
        list
    ) {

        count.textContent =
            list.length +
            (
                list.length === 1
                ? " prompt"
                : " prompts"
            );


        if (!list.length) {

            results.innerHTML =

                `<div class="empty">

                    No prompts found.

                </div>`;

            return;

        }


        results.innerHTML =

            list
                .map(
                    prompt =>
                        createPromptCard(
                            prompt
                        )
                )
                .join("");

    }


    /* =========================================
       PROMPT CARD
       ========================================= */


    function createPromptCard(
        prompt
    ) {

        const areas =
            (prompt.areas || [])
                .join(", ") ||
            "—";


        const badges =
            (prompt.badges || [])
                .join(", ") ||
            "—";


        return `

            <div class="prompt">


                <h2>
                    ${escapeHTML(
                        prompt.prompt
                    )}
                </h2>


                <div>

                    <strong>
                        Answer
                    </strong>

                    <br>

                    <span class="answer">

                        ${escapeHTML(
                            prompt.answer
                        )}

                    </span>

                </div>


                <div class="metadata">


                    <span class="label">
                        Dimension:
                    </span>

                    ${escapeHTML(
                        prompt.dimension || "—"
                    )}

                    <br>


                    <span class="label">
                        Area:
                    </span>

                    ${escapeHTML(
                        areas
                    )}

                    <br>


                    <span class="label">
                        Badge:
                    </span>

                    ${escapeHTML(
                        badges
                    )}

                    <br>


                    <span class="label">
                        Color:
                    </span>

                    ${escapeHTML(
                        prompt.color || "—"
                    )}

                    <br>


                    <span class="label">
                        Height:
                    </span>

                    ${escapeHTML(
                        prompt.height || "—"
                    )}

                    <br>


                    <span class="label">
                        Mechanic:
                    </span>

                    ${escapeHTML(
                        prompt.mechanic || "—"
                    )}

                    <br>


                    <span class="label">
                        Verified:
                    </span>

                    ${
                        prompt.verified
                        ? "✓"
                        : "—"
                    }


                    <br>


                    <span class="label">
                        Source:
                    </span>

                    ${escapeHTML(
                        prompt.source || "None listed"
                    )}

                    <br>


                    <span class="label">
                        Notes:
                    </span>

                    ${escapeHTML(
                        prompt.notes || "—"
                    )}


                </div>


                ${
                    prompt.evidence

                    ?

                    `

                    <p>

                        <a
                            href="${escapeHTML(
                                prompt.evidence
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            View evidence
                        </a>

                    </p>

                    `

                    :

                    ""

                }


            </div>

        `;

    }


    /* =========================================
       SEARCH
       ========================================= */


    search.addEventListener(
        "input",
        function() {

            const query =
                search.value
                    .trim()
                    .toLowerCase();


            if (!query) {

                displayPrompts(
                    prompts
                );

                return;

            }


            const filtered =
                prompts.filter(
                    prompt => {

                        const text = [

                            prompt.prompt,

                            prompt.answer,

                            prompt.dimension,

                            ...(prompt.areas || []),

                            ...(prompt.badges || []),

                            prompt.color,

                            prompt.height,

                            prompt.mechanic,

                            prompt.source,

                            prompt.notes

                        ]

                            .filter(Boolean)

                            .join(" ")

                            .toLowerCase();


                        return text.includes(
                            query
                        );

                    }
                );


            displayPrompts(
                filtered
            );

        }
    );


    /* =========================================
       HTML ESCAPING
       ========================================= */


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       START
       ========================================= */


    loadPrompts();


</script>


</body>

</html>
