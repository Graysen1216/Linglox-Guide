<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

<title>Linglox Prompt Database - Linglox Companion</title>

<meta
    name="description"
    content="Search the Linglox Companion prompt database for Linglox prompts, answers, mechanics, colors, heights, dimensions, areas, and badges."
>
    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            overflow-x: hidden;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
            margin: 10px 0 0;
        }

        main {
            width: min(1100px, calc(100% - 40px));
            margin: auto;
            padding: 40px 0;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .search-box {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            min-height: 48px;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #101820;
            color: white;
            font-size: 16px;
        }

        .search-box input::placeholder {
            color: #8fa7ad;
        }

        .search-box input:focus {
            outline: 3px solid #8ed8e5;
            outline-offset: 2px;
            border-color: #3b8190;
        }

        .count {
            color: #a8bcc1;
            margin-bottom: 20px;
        }

        .prompt-card {
            display: block;
            padding: 22px;
            margin-bottom: 15px;
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition:
                transform 0.15s,
                border-color 0.15s,
                background 0.15s;
        }

        .prompt-card:hover {
            transform: translateY(-2px);
            border-color: #3b8190;
            background: #1b3037;
        }

        .prompt-card:focus-visible {
            outline: 3px solid #8ed8e5;
            outline-offset: 3px;
        }

        .prompt-card h2 {
            margin: 0 0 12px;
            padding-right: 35px;
            font-size: 25px;
        }

        .metadata {
            color: #afc4c9;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .arrow {
            float: right;
            margin-left: 15px;
            color: #8ed8e5;
            font-size: 20px;
        }

        .loading,
        .empty {
            padding: 40px;
            text-align: center;
            color: #a8bcc1;
        }

        .error {
            padding: 20px;
            background: #3d2529;
            border: 1px solid #70454b;
            border-radius: 10px;
            color: #ffb0b0;
            overflow-wrap: anywhere;
        }

        .admin-link {
            display: none;
            margin-top: 20px;
        }

        .admin-link a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: #29454d;
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .admin-link a:hover {
            background: #3b8190;
        }

        .admin-link a:focus-visible {
            outline: 3px solid #8ed8e5;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 30px;
            }

            main {
                width: min(100% - 24px, 1100px);
                padding: 28px 0 35px;
            }

            .search-box {
                padding: 16px;
            }

            .prompt-card {
                padding: 18px;
            }

            .prompt-card h2 {
                font-size: 21px;
            }

            .loading,
            .empty {
                padding: 30px 18px;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            .prompt-card {
                transition: none;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        Prompt Database
    </h1>

    <p>
        Linglox Companion
    </p>


    <div
        id="adminLink"
        class="admin-link"
    >

        <a href="admin.html">
            ⚙ Admin Panel
        </a>

    </div>

</header>


<main>


    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search prompts, answers, badges, areas..."
            autocomplete="off"
        >

    </div>


    <div
        id="count"
        class="count"
    >
        Loading...
    </div>


    <div id="results">

        <div class="loading">
            Loading prompts...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    const SUPABASE_URL =
        "https://njjqjvsoydazatafclwc.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_-ro-MLRQ47X2bYtPRZtrng_Kp17EZfi";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    const search =
        document.getElementById(
            "search"
        );


    const results =
        document.getElementById(
            "results"
        );


    const count =
        document.getElementById(
            "count"
        );


    let prompts = [];


    async function checkAdmin() {

        const {
            data: {
                user
            }
        } =
        await supabaseClient.auth.getUser();


        if (!user) {
            return;
        }


        const {
            data
        } =
        await supabaseClient

            .from("admin_users")

            .select("user_id")

            .eq(
                "user_id",
                user.id
            )

            .maybeSingle();


        if (data) {

            document
                .getElementById(
                    "adminLink"
                )
                .style.display =
                    "block";

        }

    }


    async function loadPrompts() {

        const {
            data,
            error
        } =
        await supabaseClient

            .from("prompts")

            .select("*")

            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (error) {

            results.innerHTML =

                `<div class="error">

                    Could not load prompts.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>`;

            count.textContent = "";

            return;

        }


        prompts =
            data || [];


        displayPrompts(
            prompts
        );

    }


    function displayPrompts(
        list
    ) {

        count.textContent =
            list.length +
            (
                list.length === 1
                ? " prompt"
                : " prompts"
            );


        if (!list.length) {

            results.innerHTML =

                `<div class="empty">

                    No prompts found.

                </div>`;

            return;

        }


        results.innerHTML =

            list
                .map(
                    prompt =>
                        createCard(
                            prompt
                        )
                )
                .join("");

    }


    function createCard(
        prompt
    ) {

        const areas =
            (prompt.areas || [])
                .join(", ") ||
            "Unknown Area";


        const badges =
            (prompt.badges || [])
                .join(", ") ||
            "No Badge";


        return `

            <a
                class="prompt-card"
                href="prompt.html?id=${encodeURIComponent(
                    prompt.id
                )}"
            >

                <span class="arrow">
                    →
                </span>


                <h2>
                    ${escapeHTML(
                        prompt.prompt
                    )}
                </h2>


                <div class="metadata">

                    ${escapeHTML(
                        prompt.dimension ||
                        "Unknown Dimension"
                    )}

                    ·

                    ${escapeHTML(
                        areas
                    )}

                    ·

                    ${escapeHTML(
                        badges
                    )}

                    <br>

                    ${escapeHTML(
                        prompt.mechanic ||
                        "Unknown Mechanic"
                    )}

                    ·

                    ${escapeHTML(
                        prompt.color ||
                        "Unknown Color"
                    )}

                    ·

                    ${escapeHTML(
                        prompt.height ||
                        "Unknown Height"
                    )}

                </div>

            </a>

        `;

    }


    search.addEventListener(
        "input",
        function() {

            const query =
                search.value
                    .trim()
                    .toLowerCase();


            if (!query) {

                displayPrompts(
                    prompts
                );

                return;

            }


            const filtered =
                prompts.filter(
                    prompt => {

                        const searchable = [

                            prompt.prompt,

                            prompt.answer,

                            prompt.dimension,

                            ...(prompt.areas || []),

                            ...(prompt.badges || []),

                            prompt.color,

                            prompt.height,

                            prompt.mechanic,

                            prompt.source,

                            prompt.notes

                        ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        return searchable.includes(
                            query
                        );

                    }
                );


            displayPrompts(
                filtered
            );

        }
    );


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    checkAdmin();

    loadPrompts();

</script>


</body>

</html>
