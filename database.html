<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prompt Database - Linglox Companion</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .search {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #17252b;
            color: white;
            font-size: 17px;
            margin-bottom: 20px;
        }

        .search::placeholder {
            color: #8da4aa;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .filter {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #17252b;
            color: white;
            font-size: 15px;
        }

        .clear-button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #29454d;
            color: white;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .clear-button:hover {
            background: #3b5961;
        }

        .database-header {
            margin-bottom: 20px;
        }

        .database-header h2 {
            margin-bottom: 5px;
        }

        .database-header p {
            color: #8da4aa;
        }

        /* PROMPT RESULT */

        .result {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 22px 25px;
            margin-bottom: 12px;
        }

        .result h2 {
            margin: 0 0 12px 0;
            font-size: 25px;
        }

        .metadata {
            color: #afc4c9;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .metadata strong {
            color: white;
        }

        .answer-row {
            margin-top: 12px;
        }

        .answer {
            background: #29454d;
            padding: 7px 12px;
            border-radius: 6px;
            display: inline-block;
            cursor: pointer;
            margin-left: 5px;
        }

        .answer.hidden {
            color: transparent;
            user-select: none;
        }

        .view-button {
            display: inline-block;
            margin-top: 15px;
            padding: 9px 15px;
            background: #2d6875;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .view-button:hover {
            background: #3b8190;
        }

        .no-results {
            background: #17252b;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #afc4c9;
        }

    </style>
</head>


<body>

<header>

    <h1>Prompt Database</h1>

    <p>Linglox Companion</p>

</header>


<main>

    <a class="back" href="index.html">
        ← Back to homepage
    </a>


    <!-- SEARCH -->

    <input
        id="searchBox"
        class="search"
        type="text"
        placeholder="Search prompts, answers, mechanics, areas, badges..."
    >


    <!-- FILTERS -->

    <div class="filters">

        <select id="dimensionFilter" class="filter">
            <option value="">All Dimensions</option>
        </select>

        <select id="areaFilter" class="filter">
            <option value="">All Areas</option>
        </select>

        <select id="badgeFilter" class="filter">
            <option value="">All Badges</option>
        </select>

        <select id="colorFilter" class="filter">
            <option value="">All Colors</option>
        </select>

        <select id="heightFilter" class="filter">
            <option value="">All Heights</option>
        </select>

        <select id="mechanicFilter" class="filter">
            <option value="">All Mechanics</option>
        </select>

        <select id="verifiedFilter" class="filter">

            <option value="">
                All Verification
            </option>

            <option value="true">
                Verified
            </option>

            <option value="false">
                Unverified
            </option>

        </select>

    </div>


    <button
        class="clear-button"
        onclick="clearFilters()"
    >
        Clear Filters
    </button>


    <!-- DATABASE HEADER -->

    <div class="database-header">

        <h2>Known Prompts</h2>

        <p id="count">
            Loading database...
        </p>

    </div>


    <!-- RESULTS -->

    <div id="results"></div>

</main>


<script>

    const searchBox =
        document.getElementById("searchBox");

    const dimensionFilter =
        document.getElementById("dimensionFilter");

    const areaFilter =
        document.getElementById("areaFilter");

    const badgeFilter =
        document.getElementById("badgeFilter");

    const colorFilter =
        document.getElementById("colorFilter");

    const heightFilter =
        document.getElementById("heightFilter");

    const mechanicFilter =
        document.getElementById("mechanicFilter");

    const verifiedFilter =
        document.getElementById("verifiedFilter");

    const resultsBox =
        document.getElementById("results");

    const countBox =
        document.getElementById("count");


    let prompts = [];


    /* LOAD DATABASE */

    fetch("data/prompts.json")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Could not load prompts.json"
                );

            }

            return response.json();

        })

        .then(data => {

            prompts = data;

            populateFilters();

            displayPrompts(prompts);

        })

        .catch(error => {

            console.error(error);

            countBox.textContent =
                "Database could not be loaded.";

            resultsBox.innerHTML = `

                <div class="no-results">

                    <h2>
                        Something went wrong
                    </h2>

                    <p>
                        The prompt database could
                        not be loaded.
                    </p>

                </div>

            `;

        });


    /* GET UNIQUE FILTER VALUES */

    function getUniqueValues(values) {

        return [...new Set(

            values
                .filter(value => value)
                .sort()

        )];

    }


    /* CREATE FILTER OPTIONS */

    function populateFilters() {

        const dimensions =
            getUniqueValues(
                prompts.map(
                    item => item.dimension
                )
            );


        const areas =
            getUniqueValues(
                prompts.flatMap(
                    item => item.areas || []
                )
            );


        const badges =
            getUniqueValues(
                prompts.flatMap(
                    item => item.badges || []
                )
            );


        const colors =
            getUniqueValues(
                prompts.map(
                    item => item.color
                )
            );


        const heights =
            getUniqueValues(
                prompts.map(
                    item => item.height
                )
            );


        const mechanics =
            getUniqueValues(
                prompts.map(
                    item => item.mechanic
                )
            );


        addOptions(
            dimensionFilter,
            dimensions
        );

        addOptions(
            areaFilter,
            areas
        );

        addOptions(
            badgeFilter,
            badges
        );

        addOptions(
            colorFilter,
            colors
        );

        addOptions(
            heightFilter,
            heights
        );

        addOptions(
            mechanicFilter,
            mechanics
        );

    }


    function addOptions(select, values) {

        values.forEach(value => {

            const option =
                document.createElement("option");

            option.value = value;

            option.textContent = value;

            select.appendChild(option);

        });

    }


    /* FILTER DATABASE */

    function filterPrompts() {

        const search =
            searchBox.value
                .toLowerCase()
                .trim();


        const dimension =
            dimensionFilter.value;

        const area =
            areaFilter.value;

        const badge =
            badgeFilter.value;

        const color =
            colorFilter.value;

        const height =
            heightFilter.value;

        const mechanic =
            mechanicFilter.value;

        const verified =
            verifiedFilter.value;


        const filtered =
            prompts.filter(item => {


                const matchesSearch =

                    item.prompt
                        .toLowerCase()
                        .includes(search)

                    ||

                    item.answer
                        .toLowerCase()
                        .includes(search)

                    ||

                    item.dimension
                        .toLowerCase()
                        .includes(search)

                    ||

                    (item.areas || [])
                        .some(area =>
                            area
                                .toLowerCase()
                                .includes(search)
                        )

                    ||

                    (item.badges || [])
                        .some(badge =>
                            badge
                                .toLowerCase()
                                .includes(search)
                        )

                    ||

                    item.color
                        .toLowerCase()
                        .includes(search)

                    ||

                    item.height
                        .toLowerCase()
                        .includes(search)

                    ||

                    item.mechanic
                        .toLowerCase()
                        .includes(search)

                    ||

                    item.notes
                        .toLowerCase()
                        .includes(search);


                const matchesDimension =
                    !dimension ||
                    item.dimension === dimension;


                const matchesArea =
                    !area ||
                    (item.areas || [])
                        .includes(area);


                const matchesBadge =
                    !badge ||
                    (item.badges || [])
                        .includes(badge);


                const matchesColor =
                    !color ||
                    item.color === color;


                const matchesHeight =
                    !height ||
                    item.height === height;


                const matchesMechanic =
                    !mechanic ||
                    item.mechanic === mechanic;


                const matchesVerified =
                    verified === "" ||
                    String(item.verified)
                        === verified;


                return (

                    matchesSearch &&
                    matchesDimension &&
                    matchesArea &&
                    matchesBadge &&
                    matchesColor &&
                    matchesHeight &&
                    matchesMechanic &&
                    matchesVerified

                );

            });


        displayPrompts(filtered);

    }


    /* DISPLAY PROMPTS */

    function displayPrompts(list) {

        countBox.textContent =
            list.length +
            (
                list.length === 1
                ? " prompt"
                : " prompts"
            );


        if (list.length === 0) {

            resultsBox.innerHTML = `

                <div class="no-results">

                    <h2>
                        No prompts found
                    </h2>

                    <p>
                        Try changing your search
                        or filters.
                    </p>

                </div>

            `;

            return;

        }


        resultsBox.innerHTML =

            list.map(item => {


                /*
                    Build the first metadata line.
                */

                const locationParts = [];


                if (item.dimension) {

                    locationParts.push(
                        item.dimension
                    );

                }


                if (
                    item.areas &&
                    item.areas.length > 0
                ) {

                    locationParts.push(
                        ...item.areas
                    );

                }


                if (
                    item.badges &&
                    item.badges.length > 0
                ) {

                    locationParts.push(
                        ...item.badges
                    );

                }


                /*
                    Build the second metadata line.
                */

                const mechanicParts = [];


                if (item.mechanic) {

                    mechanicParts.push(
                        item.mechanic
                    );

                }


                if (item.color) {

                    mechanicParts.push(
                        item.color
                    );

                }


                if (item.height) {

                    mechanicParts.push(
                        item.height
                    );

                }


                return `

                    <div class="result">

                        <h2>
                            ${item.prompt}
                        </h2>


                        ${
                            locationParts.length > 0

                            ?

                            `
                            <div class="metadata">

                                ${locationParts.join(
                                    " · "
                                )}

                            </div>
                            `

                            :

                            ""
                        }


                        ${
                            mechanicParts.length > 0

                            ?

                            `
                            <div class="metadata">

                                ${mechanicParts.join(
                                    " · "
                                )}

                            </div>
                            `

                            :

                            ""
                        }


                        <div class="answer-row">

                            <strong>
                                Answer:
                            </strong>

                            <span
                                class="answer hidden"
                                onclick="
                                    revealAnswer(this)
                                "
                            >

                                ${item.answer}

                            </span>

                        </div>


                        <a
                            class="view-button"
                            href="prompt.html?id=${encodeURIComponent(
                                item.id
                            )}"
                        >

                            View Prompt →

                        </a>

                    </div>

                `;

            }).join("");

    }


    /* SEARCH */

    searchBox.addEventListener(
        "input",
        filterPrompts
    );


    /* FILTER EVENTS */

    dimensionFilter.addEventListener(
        "change",
        filterPrompts
    );


    areaFilter.addEventListener(
        "change",
        filterPrompts
    );


    badgeFilter.addEventListener(
        "change",
        filterPrompts
    );


    colorFilter.addEventListener(
        "change",
        filterPrompts
    );


    heightFilter.addEventListener(
        "change",
        filterPrompts
    );


    mechanicFilter.addEventListener(
        "change",
        filterPrompts
    );


    verifiedFilter.addEventListener(
        "change",
        filterPrompts
    );


    /* CLEAR FILTERS */

    function clearFilters() {

        searchBox.value = "";

        dimensionFilter.value = "";
        areaFilter.value = "";
        badgeFilter.value = "";
        colorFilter.value = "";
        heightFilter.value = "";
        mechanicFilter.value = "";
        verifiedFilter.value = "";

        displayPrompts(prompts);

    }


    /* SPOILER */

    function revealAnswer(element) {

        element.classList.remove(
            "hidden"
        );

    }

</script>

</body>
</html>
