<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Database - Linglox Companion</title>

    <link rel="stylesheet" href="global.css">

</head>


<body>


<header>

    <h1>
        Prompt Database
    </h1>

    <p>
        Linglox Companion
    </p>

    <div
        id="adminLink"
        class="admin-link"
    >

        <a href="admin.html">
            ⚙ Admin Panel
        </a>

    </div>

</header>


<main>


    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search prompts, answers, badges, areas..."
            autocomplete="off"
        >

    </div>


    <div
        id="count"
        class="count"
    >
        Loading...
    </div>


    <div id="results">

        <div class="loading">
            Loading prompts...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    const SUPABASE_URL =
        "https://njjqjvsoydazatafclwc.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_-ro-MLRQ47X2bYtPRZtrng_Kp17EZfi";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    const search =
        document.getElementById(
            "search"
        );


    const results =
        document.getElementById(
            "results"
        );


    const count =
        document.getElementById(
            "count"
        );


    let prompts = [];


    /* =========================================
       CHECK ADMIN
       ========================================= */


    async function checkAdmin() {

        const {
            data: {
                user
            }
        } =
        await supabaseClient.auth.getUser();


        if (!user) {
            return;
        }


        const {
            data
        } =
        await supabaseClient

            .from("admin_users")

            .select("user_id")

            .eq(
                "user_id",
                user.id
            )

            .maybeSingle();


        if (data) {

            document
                .getElementById("adminLink")
                .style.display = "block";

        }

    }


    /* =========================================
       LOAD PROMPTS
       ========================================= */


    async function loadPrompts() {

        const {
            data,
            error
        } =
        await supabaseClient

            .from("prompts")

            .select("*")

            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (error) {

            results.innerHTML =

                `<div class="error">

                    Could not load prompts.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>`;

            count.textContent = "";

            return;

        }


        prompts =
            data || [];


        displayPrompts(
            prompts
        );

    }


    /* =========================================
       DISPLAY PROMPTS
       ========================================= */


    function displayPrompts(
        list
    ) {

        count.textContent =
            list.length +
            (
                list.length === 1
                ? " prompt"
                : " prompts"
            );


        if (!list.length) {

            results.innerHTML =

                `<div class="empty">
                    No prompts found.
                </div>`;

            return;

        }


        results.innerHTML =

            list
                .map(
                    prompt =>
                        createCard(
                            prompt
                        )
                )
                .join("");

    }


    /* =========================================
       CREATE PROMPT CARD
       ========================================= */


    function createCard(
        prompt
    ) {

        const areas =
            (prompt.areas || [])
                .join(", ") ||
            "Unknown Area";


        const badges =
            (prompt.badges || [])
                .join(", ") ||
            "No Badge";


        return `

            <a
                class="prompt-card"
                href="prompt.html?id=${encodeURIComponent(
                    prompt.id
                )}"
            >

                <span class="arrow">
                    →
                </span>


                <h2>
                    ${escapeHTML(
                        prompt.prompt
                    )}
                </h2>


                <div class="metadata">

                    ${escapeHTML(
                        prompt.dimension ||
                        "Unknown Dimension"
                    )}

                    ·

                    ${escapeHTML(
                        areas
                    )}

                    ·

                    ${escapeHTML(
                        badges
                    )}

                    <br>

                    ${escapeHTML(
                        prompt.mechanic ||
                        "Unknown Mechanic"
                    )}

                    ·

                    ${escapeHTML(
                        prompt.color ||
                        "Unknown Color"
                    )}

                    ·

                    ${escapeHTML(
                        prompt.height ||
                        "Unknown Height"
                    )}

                </div>


            </a>

        `;

    }


    /* =========================================
       SEARCH
       ========================================= */


    search.addEventListener(
        "input",
        function() {

            const query =
                search.value
                    .trim()
                    .toLowerCase();


            if (!query) {

                displayPrompts(
                    prompts
                );

                return;

            }


            const filtered =
                prompts.filter(
                    prompt => {

                        const searchable = [

                            prompt.prompt,

                            prompt.answer,

                            prompt.dimension,

                            ...(prompt.areas || []),

                            ...(prompt.badges || []),

                            prompt.color,

                            prompt.height,

                            prompt.mechanic,

                            prompt.source,

                            prompt.notes

                        ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        return searchable.includes(
                            query
                        );

                    }
                );


            displayPrompts(
                filtered
            );

        }
    );


    /* =========================================
       HTML ESCAPING
       ========================================= */


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       START
       ========================================= */


    checkAdmin();

    loadPrompts();


</script>


</body>

</html>
