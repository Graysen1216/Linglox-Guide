<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Database - Linglox Companion</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .search {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #17252b;
            color: white;
            font-size: 17px;
        }

        .search::placeholder {
            color: #8da4aa;
        }

        .info {
            margin-top: 30px;
            padding: 25px;
            background: #17252b;
            border-radius: 12px;
        }

        .info h2 {
            margin-top: 0;
        }

        .info p {
            color: #afc4c9;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <header>
        <h1>Prompt Database</h1>
        <p>Linglox Companion</p>
    </header>

    <main>

        <a class="back" href="index.html">← Back to homepage</a>

        <input
            class="search"
            type="text"
            placeholder="Search prompts..."
        >

        <div class="info">
            <h2>Database</h2>
            <p>
                The Linglox prompt database will live here.
            </p>

            <p>
                We're just getting started!
            </p>
        </div>

    </main>

</body>
</html>
