<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Submit a Prompt - Linglox Companion</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .box {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .box h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #101820;
            color: white;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #2d6875;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3b8190;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .help {
            color: #8da4aa;
            font-size: 14px;
            margin-top: 5px;
        }

        .success {
            color: #9be7b0;
        }

        .error {
            color: #ff9b9b;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 32px;
            }

            main {
                padding: 30px 15px;
            }

            .box {
                padding: 20px;
            }

            button {
                width: 100%;
                min-height: 44px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>
        Submit a Prompt
    </h1>

    <p>
        Help expand the Linglox Companion database.
    </p>

</header>


<main>

    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <div class="box">

        <h2>
            Prompt Information
        </h2>

        <p>
            Submissions are reviewed before they become
            part of the official database.
        </p>


        <form id="promptForm">


            <label for="prompt">
                Prompt *
            </label>

            <input
                id="prompt"
                required
                placeholder="Example: earth"
            >


            <label for="answer">
                Answer *
            </label>

            <input
                id="answer"
                required
                placeholder="Example: world"
            >


            <label for="dimension">
                Dimension
            </label>

            <input
                id="dimension"
                placeholder="Example: Unaffiliated"
            >


            <label for="area">
                Area
            </label>

            <input
                id="area"
                placeholder="Example: Example Area"
            >


            <label for="badge">
                Badge
            </label>

            <input
                id="badge"
                placeholder="Example: Example Badge"
            >


            <label for="color">
                Prompt Color
            </label>

            <input
                id="color"
                placeholder="Example: Institutional White"
            >


            <label for="height">
                Height
            </label>

            <input
                id="height"
                placeholder="Example: Low"
            >


            <label for="mechanic">
                Mechanic
            </label>

            <input
                id="mechanic"
                placeholder="Example: Synonym"
            >


            <label for="source">
                Source
            </label>

            <select id="source">

                <option value="In-game">
                    In-game
                </option>

                <option value="Screenshot">
                    Screenshot
                </option>

                <option value="Community report">
                    Community report
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="notes">
                Notes
            </label>

            <textarea
                id="notes"
                placeholder="Anything else we should know?"
            ></textarea>


            <label for="evidence">
                Evidence / Screenshot URL
            </label>

            <input
                id="evidence"
                placeholder="Optional"
            >

            <p class="help">

                If you have evidence, provide a link to it here.

            </p>


            <button
                id="submitButton"
                type="submit"
            >
                Submit for Review
            </button>


        </form>

    </div>


    <div
        class="box hidden"
        id="resultBox"
    >

        <h2 id="resultTitle"></h2>

        <p id="resultMessage"></p>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    const SUPABASE_URL =
        "https://njjqjvsoydazatafclwc.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_-ro-MLRQ47X2bYtPRZtrng_Kp17EZfi";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    const form =
        document.getElementById(
            "promptForm"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const resultBox =
        document.getElementById(
            "resultBox"
        );


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    const resultMessage =
        document.getElementById(
            "resultMessage"
        );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            submitButton.disabled = true;

            submitButton.textContent =
                "Submitting...";


            const prompt =
                document
                    .getElementById("prompt")
                    .value
                    .trim();


            const answer =
                document
                    .getElementById("answer")
                    .value
                    .trim();


            const dimension =
                document
                    .getElementById("dimension")
                    .value
                    .trim();


            const area =
                document
                    .getElementById("area")
                    .value
                    .trim();


            const badge =
                document
                    .getElementById("badge")
                    .value
                    .trim();


            const color =
                document
                    .getElementById("color")
                    .value
                    .trim();


            const height =
                document
                    .getElementById("height")
                    .value
                    .trim();


            const mechanic =
                document
                    .getElementById("mechanic")
                    .value
                    .trim();


            const source =
                document
                    .getElementById("source")
                    .value;


            const notes =
                document
                    .getElementById("notes")
                    .value
                    .trim();


            const evidence =
                document
                    .getElementById("evidence")
                    .value
                    .trim();


            const submission = {

                prompt: prompt,

                answer: answer,

                dimension:
                    dimension || null,

                areas:
                    area
                    ? [area]
                    : [],

                badges:
                    badge
                    ? [badge]
                    : [],

                color:
                    color || null,

                height:
                    height || null,

                mechanic:
                    mechanic || null,

                source:
                    source,

                notes:
                    notes || null,

                evidence:
                    evidence || null,

                status:
                    "pending"

            };


            const {
                error
            } =
            await supabaseClient

                .from("submissions")

                .insert(
                    submission
                );


            if (error) {

                console.error(
                    error
                );


                resultBox.classList
                    .remove("hidden");


                resultTitle
                    .textContent =
                    "Submission failed";


                resultTitle.className =
                    "error";


                resultMessage
                    .textContent =
                    error.message;


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "Submit for Review";


                return;

            }


            form.reset();


            resultBox.classList
                .remove("hidden");


            resultTitle
                .textContent =
                "Submission received! 🎉";


            resultTitle.className =
                "success";


            resultMessage
                .textContent =
                "Thanks! Your submission has been sent for review. If it is approved, it will be added to the official database.";


            submitButton.disabled =
                false;


            submitButton.textContent =
                "Submit for Review";


            resultBox.scrollIntoView({
                behavior: "smooth"
            });

        }
    );

</script>

</body>

</html>
