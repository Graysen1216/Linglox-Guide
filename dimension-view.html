<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dimension - Linglox Companion</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .info {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .info h2 {
            margin-top: 0;
        }

        .count {
            color: #a8bcc1;
        }

        .prompt-card {
            display: block;
            text-decoration: none;
            color: white;

            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;

            padding: 22px;
            margin-bottom: 15px;

            transition:
                transform 0.15s,
                border-color 0.15s,
                background 0.15s;
        }

        .prompt-card:hover {
            transform: translateY(-2px);
            border-color: #3b8190;
            background: #1b3037;
        }

        .prompt-card h2 {
            margin: 0 0 12px 0;
            font-size: 25px;
        }

        .metadata {
            color: #afc4c9;
            line-height: 1.7;
        }

        .arrow {
            float: right;
            color: #8ed8e5;
            font-size: 20px;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #a8bcc1;
        }

        .error {
            background: #3d2529;
            border: 1px solid #70454b;
            border-radius: 10px;
            padding: 20px;
            color: #ffb0b0;
        }

    </style>

</head>


<body>


<header>

    <h1 id="dimensionName">
        Loading...
    </h1>

    <p>
        Linglox Companion
    </p>

</header>


<main>


    <a
        class="back"
        href="dimensions.html"
    >
        ← Back to dimensions
    </a>


    <div class="info">

        <h2>
            Prompts in this dimension
        </h2>

        <div
            id="count"
            class="count"
        >
            Loading...
        </div>

    </div>


    <div id="results">

        <div class="loading">
            Loading prompts...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    const SUPABASE_URL =
        "https://njjqjvsoydazatafclwc.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_-ro-MLRQ47X2bYtPRZtrng_Kp17EZfi";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    const dimensionName =
        document.getElementById(
            "dimensionName"
        );


    const results =
        document.getElementById(
            "results"
        );


    const count =
        document.getElementById(
            "count"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const dimension =
        params.get("name");


    if (!dimension) {

        dimensionName.textContent =
            "Dimension Not Found";

        count.textContent = "";

        results.innerHTML =

            `<div class="error">

                No dimension was specified.

            </div>`;

    } else {

        loadPrompts();

    }


    async function loadPrompts() {

        dimensionName.textContent =
            dimension;


        const {
            data,
            error
        } =
        await supabaseClient

            .from("prompts")

            .select("*")

            .eq(
                "dimension",
                dimension
            )

            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (error) {

            count.textContent = "";

            results.innerHTML =

                `<div class="error">

                    Could not load prompts.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>`;

            return;

        }


        const prompts =
            data || [];


        count.textContent =
            prompts.length +
            (
                prompts.length === 1
                ? " prompt"
                : " prompts"
            );


        if (!prompts.length) {

            results.innerHTML =

                `<div class="empty">

                    No prompts have been added
                    to this dimension yet.

                </div>`;

            return;

        }


        results.innerHTML =

            prompts
                .map(
                    prompt =>
                        createCard(
                            prompt
                        )
                )
                .join("");

    }


    function createCard(
        prompt
    ) {

        const areas =
            (prompt.areas || [])
                .join(", ") ||
            "Unknown Area";


        const badges =
            (prompt.badges || [])
                .join(", ") ||
            "No Badge";


        return `

            <a
                class="prompt-card"
                href="prompt.html?id=${encodeURIComponent(
                    prompt.id
                )}"
            >

                <span class="arrow">
                    →
                </span>


                <h2>

                    ${escapeHTML(
                        prompt.prompt
                    )}

                </h2>


                <div class="metadata">

                    <strong>
                        Answer:
                    </strong>

                    ${escapeHTML(
                        prompt.answer ||
                        "Unknown Answer"
                    )}

                    <br>

                    <strong>
                        Areas:
                    </strong>

                    ${escapeHTML(
                        areas
                    )}

                    <br>

                    <strong>
                        Badges:
                    </strong>

                    ${escapeHTML(
                        badges
                    )}

                    <br>

                    ${escapeHTML(
                        prompt.mechanic ||
                        "Unknown Mechanic"
                    )}

                    ·

                    ${escapeHTML(
                        prompt.color ||
                        "Unknown Color"
                    )}

                    ·

                    ${escapeHTML(
                        prompt.height ||
                        "Unknown Height"
                    )}

                </div>

            </a>

        `;

    }


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


</script>


</body>

</html>
