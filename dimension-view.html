<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dimension - Linglox Companion</title>

    <link rel="stylesheet" href="global.css">

</head>


<body>


<header>

    <h1 id="dimensionName">
        Loading...
    </h1>

    <p>
        Linglox Companion
    </p>

</header>


<main>


    <a
        class="back"
        href="dimensions.html"
    >
        ← Back to dimensions
    </a>


    <div class="info">

        <h2>
            Prompts in this dimension
        </h2>

        <div
            id="count"
            class="count"
        >
            Loading...
        </div>

    </div>


    <div id="results">

        <div class="loading">
            Loading prompts...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    const SUPABASE_URL =
        "https://njjqjvsoydazatafclwc.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_-ro-MLRQ47X2bYtPRZtrng_Kp17EZfi";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    const dimensionName =
        document.getElementById(
            "dimensionName"
        );


    const results =
        document.getElementById(
            "results"
        );


    const count =
        document.getElementById(
            "count"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const dimension =
        params.get("name");


    if (!dimension) {

        dimensionName.textContent =
            "Dimension Not Found";

        count.textContent = "";

        results.innerHTML =

            `<div class="error">

                No dimension was specified.

            </div>`;

    } else {

        loadPrompts();

    }


    /* =========================================
       LOAD PROMPTS
       ========================================= */


    async function loadPrompts() {

        dimensionName.textContent =
            dimension;


        const {
            data,
            error
        } =
        await supabaseClient

            .from("prompts")

            .select("*")

            .eq(
                "dimension",
                dimension
            );


        if (error) {

            count.textContent = "";

            results.innerHTML =

                `<div class="error">

                    Could not load prompts.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>`;

            return;

        }


        const prompts =
            data || [];


        count.textContent =
            prompts.length +
            (
                prompts.length === 1
                ? " prompt"
                : " prompts"
            );


        if (!prompts.length) {

            results.innerHTML =

                `<div class="empty">

                    No prompts have been added
                    to this dimension yet.

                </div>`;

            return;

        }


        /*
         * Group prompts by badge.
         */

        const grouped = {};


        prompts.forEach(
            prompt => {

                const promptBadges =
                    prompt.badges || [];


                if (!promptBadges.length) {

                    if (!grouped["Other"]) {

                        grouped["Other"] = [];

                    }

                    grouped["Other"].push(
                        prompt
                    );

                    return;

                }


                promptBadges.forEach(
                    badge => {

                        if (!grouped[badge]) {

                            grouped[badge] = [];

                        }

                        grouped[badge].push(
                            prompt
                        );

                    }
                );

            }
        );


        /*
         * Sort badges alphabetically.
         */

        const sortedBadges =
            Object.keys(grouped)
                .sort(
                    (a, b) =>
                        a.localeCompare(
                            b,
                            undefined,
                            {
                                sensitivity: "base"
                            }
                        )
                );


        results.innerHTML =

            sortedBadges
                .map(
                    badge =>
                        createBadgeSection(
                            badge,
                            grouped[badge]
                        )
                )
                .join("");

    }


    /* =========================================
       CREATE BADGE SECTION
       ========================================= */


    function createBadgeSection(
        badge,
        prompts
    ) {

        /*
         * Sort prompts alphabetically
         * within each badge.
         */

        prompts.sort(
            (a, b) =>
                String(a.prompt || "")
                    .localeCompare(
                        String(b.prompt || ""),
                        undefined,
                        {
                            sensitivity: "base"
                        }
                    )
        );


        return `

            <div class="badge-section">

                <div class="badge-title">

                    <h2>

                        ${escapeHTML(
                            badge
                        )}

                    </h2>

                    <div class="badge-count">

                        ${prompts.length}

                        ${
                            prompts.length === 1
                            ? "prompt"
                            : "prompts"
                        }

                    </div>

                </div>


                ${prompts
                    .map(
                        prompt =>
                            createCard(
                                prompt
                            )
                    )
                    .join("")}

            </div>

        `;

    }


    /* =========================================
       CREATE PROMPT CARD
       ========================================= */


    function createCard(
        prompt
    ) {

        const areas =
            (prompt.areas || [])
                .join(", ") ||
            "Unknown Area";


        return `

            <a
                class="prompt-card"
                href="prompt.html?id=${encodeURIComponent(
                    prompt.id
                )}"
            >

                <span class="arrow">
                    →
                </span>


                <h3>

                    ${escapeHTML(
                        prompt.prompt
                    )}

                </h3>


                <div class="metadata">

                    <strong>
                        Answer:
                    </strong>

                    ${escapeHTML(
                        prompt.answer ||
                        "Unknown Answer"
                    )}

                    <br>


                    <strong>
                        Areas:
                    </strong>

                    ${escapeHTML(
                        areas
                    )}

                    <br>


                    ${
                        prompt.mechanic
                        ? escapeHTML(
                            prompt.mechanic
                        ) + " · "
                        : ""
                    }

                    ${
                        prompt.color
                        ? escapeHTML(
                            prompt.color
                        ) + " · "
                        : ""
                    }

                    ${
                        prompt.height
                        ? escapeHTML(
                            prompt.height
                        )
                        : ""
                    }

                </div>

            </a>

        `;

    }


    /* =========================================
       HTML ESCAPING
       ========================================= */


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


</script>


</body>

</html>
