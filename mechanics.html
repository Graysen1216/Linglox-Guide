<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mechanics - Linglox Companion</title>

    <link rel="stylesheet" href="global.css">

    <style>
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .controls input {
            flex: 1 1 260px;
            min-width: 220px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            cursor: pointer;
            border: 1px solid #3b4650;
            background: #18232c;
            color: inherit;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .tab.active {
            background: #263744;
            border-color: #5a6b78;
        }

        .mechanic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
        }

        .mechanic-card {
            background: #18232c;
            border: 1px solid #2d3a44;
            border-radius: 12px;
            padding: 18px;
            overflow: hidden;
        }

        .mechanic-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .swatch {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.25);
            flex: 0 0 auto;
        }

        .mechanic-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .theme {
            margin: 4px 0 0;
            opacity: .75;
            font-size: 14px;
        }

        .height {
            margin-top: 12px;
            padding: 12px;
            background: #101820;
            border-radius: 8px;
        }

        .height strong {
            display: block;
            margin-bottom: 5px;
        }

        .description {
            opacity: .9;
            line-height: 1.55;
        }

        .variant {
            margin-top: 16px;
            border-top: 1px solid #2d3a44;
            padding-top: 16px;
        }

        .variant h3 {
            margin: 0;
            font-size: 17px;
        }

        .material-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #263744;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .empty {
            opacity: .7;
            padding: 30px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .error {
            color: #ff9999;
            background: #301c1c;
            border: 1px solid #633333;
            border-radius: 10px;
            padding: 18px;
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            .mechanic-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Mechanics</h1>
    <p>Explore the colors and materials of Linglox</p>
</header>

<main>

    <a class="back" href="index.html">← Back to homepage</a>

    <div class="intro">
        <h2>Linglox Mechanics</h2>
        <p>Browse color mechanics and material mechanics from the official-wiki data.</p>
    </div>

    <div class="controls">
        <input
            id="search"
            type="text"
            placeholder="Search mechanics and materials..."
            autocomplete="off"
        >
    </div>

    <div class="tabs">
        <button
            class="tab active"
            type="button"
            data-tab="colors"
        >
            Colors
        </button>

        <button
            class="tab"
            type="button"
            data-tab="materials"
        >
            Materials
        </button>
    </div>

    <div id="mechanics" class="mechanic-grid">
        <div class="empty">Loading mechanics...</div>
    </div>

</main>

<!--
    mechanics.js MUST be loaded before the code below.
    It defines:

        const mechanics = [...]
        const materials = [...]
        const mechanicsData = {
            colors: mechanics,
            materials: materials
        };
-->
<script src="mechanics.js"></script>

<script>
(function () {
    "use strict";

    const box = document.getElementById("mechanics");
    const search = document.getElementById("search");
    const tabs = Array.from(document.querySelectorAll(".tab"));

    let currentTab = "colors";

    /*
     * mechanics.js provides mechanicsData.
     *
     * Using mechanicsData here keeps this page tied to the
     * single data object exported by mechanics.js.
     */
    if (
        typeof mechanicsData === "undefined" ||
        !mechanicsData ||
        !Array.isArray(mechanicsData.colors) ||
        !Array.isArray(mechanicsData.materials)
    ) {
        box.innerHTML = `
            <div class="error">
                <strong>Could not load mechanics data.</strong>
                <br><br>
                Make sure <code>mechanics.js</code> is in the same folder
                as this page and contains the mechanicsData object.
            </div>
        `;

        return;
    }

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function searchable(item) {
        const values = [
            item.name,
            item.theme,
            item.description,
            item.high,
            item.middle,
            item.low,
            item.checker,
            item.notes
        ];

        if (Array.isArray(item.variants)) {
            item.variants.forEach(variant => {
                values.push(
                    variant.name,
                    variant.theme,
                    variant.description,
                    variant.high,
                    variant.middle,
                    variant.low,
                    variant.checker,
                    variant.notes
                );
            });
        }

        return values
            .filter(value => value !== undefined && value !== null)
            .join(" ")
            .toLowerCase();
    }

    function heightBlock(label, value) {
        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {
            return "";
        }

        return `
            <div class="height">
                <strong>${escapeHTML(label)}</strong>
                <div>${escapeHTML(value)}</div>
            </div>
        `;
    }

    function renderColor(item) {
        return `
            <article class="mechanic-card">

                <div class="mechanic-header">

                    <span
                        class="swatch"
                        style="background-color: ${escapeHTML(item.color || "#333333")};"
                        aria-hidden="true"
                    ></span>

                    <div>
                        <h2>${escapeHTML(item.name)}</h2>

                        ${
                            item.theme
                                ? `
                                    <div class="theme">
                                        ${escapeHTML(item.theme)}
                                    </div>
                                `
                                : ""
                        }
                    </div>

                </div>

                ${heightBlock("High", item.high)}
                ${heightBlock("Middle", item.middle)}
                ${heightBlock("Low", item.low)}
                ${heightBlock("Checker", item.checker)}

            </article>
        `;
    }

    function renderMaterial(item) {
        const variants = Array.isArray(item.variants)
            ? item.variants
            : [];

        return `
            <article class="mechanic-card">

                <span class="material-badge">
                    Material
                </span>

                <div class="mechanic-header">

                    <div>
                        <h2>${escapeHTML(item.name)}</h2>

                        ${
                            item.theme
                                ? `
                                    <div class="theme">
                                        ${escapeHTML(item.theme)}
                                    </div>
                                `
                                : ""
                        }
                    </div>

                </div>

                ${
                    item.description
                        ? `
                            <div class="description">
                                ${escapeHTML(item.description)}
                            </div>
                        `
                        : ""
                }

                ${heightBlock("High", item.high)}
                ${heightBlock("Middle", item.middle)}
                ${heightBlock("Low", item.low)}

                ${
                    item.checker &&
                    item.checker !== "N/A"
                        ? heightBlock("Checker", item.checker)
                        : ""
                }

                ${
                    item.notes
                        ? `
                            <div
                                class="description"
                                style="margin-top: 12px;"
                            >
                                <strong>Notes:</strong>
                                ${escapeHTML(item.notes)}
                            </div>
                        `
                        : ""
                }

                ${
                    variants.length
                        ? variants.map(renderVariant).join("")
                        : ""
                }

            </article>
        `;
    }

    function renderVariant(variant) {
        return `
            <div class="variant">

                <div class="mechanic-header">

                    <span
                        class="swatch"
                        style="background-color: ${escapeHTML(variant.color || "#333333")};"
                        aria-hidden="true"
                    ></span>

                    <div>
                        <h3>
                            ${escapeHTML(variant.name)}
                        </h3>

                        ${
                            variant.theme
                                ? `
                                    <div class="theme">
                                        ${escapeHTML(variant.theme)}
                                    </div>
                                `
                                : ""
                        }
                    </div>

                </div>

                ${
                    variant.description
                        ? `
                            <div class="description">
                                ${escapeHTML(variant.description)}
                            </div>
                        `
                        : ""
                }

                ${heightBlock("High", variant.high)}
                ${heightBlock("Middle", variant.middle)}
                ${heightBlock("Low", variant.low)}

                ${
                    variant.checker &&
                    variant.checker !== "N/A"
                        ? heightBlock("Checker", variant.checker)
                        : ""
                }

                ${
                    variant.notes
                        ? `
                            <div
                                class="description"
                                style="margin-top: 12px;"
                            >
                                <strong>Notes:</strong>
                                ${escapeHTML(variant.notes)}
                            </div>
                        `
                        : ""
                }

            </div>
        `;
    }

    function render() {
        const source =
            currentTab === "colors"
                ? mechanicsData.colors
                : mechanicsData.materials;

        const query = search.value
            .trim()
            .toLowerCase();

        const list = query
            ? source.filter(item => searchable(item).includes(query))
            : source;

        if (list.length === 0) {
            box.innerHTML = `
                <div class="empty">
                    No matching ${currentTab} found.
                </div>
            `;

            return;
        }

        box.innerHTML = list
            .map(
                currentTab === "colors"
                    ? renderColor
                    : renderMaterial
            )
            .join("");
    }

    tabs.forEach(tab => {
        tab.addEventListener("click", function () {

            tabs.forEach(otherTab => {
                otherTab.classList.remove("active");
            });

            tab.classList.add("active");

            currentTab = tab.dataset.tab;

            search.value = "";

            render();
        });
    });

    search.addEventListener("input", render);

    render();

})();
</script>

</body>
</html>
