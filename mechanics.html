<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mechanics - Linglox Companion</title>

    <link rel="stylesheet" href="global.css">

    <style>

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .controls button {
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
        }

        .controls button.active {
            font-weight: bold;
            outline: 2px solid currentColor;
        }

        .mechanics-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
        }

        .mechanic-card {
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .mechanic-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .swatch {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            flex: 0 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .mechanic-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .theme {
            margin: 3px 0 0;
            opacity: 0.75;
        }

        .mechanic-body {
            padding: 0 16px 16px;
        }

        .height {
            margin-top: 12px;
            padding: 11px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.18);
        }

        .height strong {
            display: block;
            margin-bottom: 4px;
        }

        .material-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 12px;
        }

        .material-description {
            line-height: 1.5;
            opacity: 0.9;
        }

        .material-notes {
            margin-top: 12px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .variant {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .variant .mechanic-header {
            padding: 0;
        }

        .variant h3 {
            margin: 0;
            font-size: 17px;
        }

        .empty,
        .loading {
            padding: 30px;
            text-align: center;
            opacity: 0.75;
            grid-column: 1 / -1;
        }

        .count {
            opacity: 0.7;
            margin-bottom: 14px;
        }

        .error {
            padding: 20px;
            border-radius: 10px;
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            line-height: 1.5;
            grid-column: 1 / -1;
        }

    </style>

</head>


<body>


<header>

    <h1>
        Mechanics
    </h1>

    <p>
        Explore Linglox colors and materials
    </p>

</header>


<main>


    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <div class="intro">

        <h2>
            Linglox Mechanics
        </h2>

        <p>
            Browse the color mechanics and the material mechanics
            imported from the Linglox Wiki XML data.
        </p>

    </div>


    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search mechanics or materials..."
            autocomplete="off"
        >

    </div>


    <div
        class="controls"
        aria-label="Mechanic type"
    >

        <button
            id="colorsTab"
            class="active"
            type="button"
        >
            Colors
        </button>

        <button
            id="materialsTab"
            type="button"
        >
            Materials
        </button>

        <button
            id="allTab"
            type="button"
        >
            All
        </button>

    </div>


    <div
        id="count"
        class="count"
    ></div>


    <div
        id="mechanics"
        class="mechanics-grid"
    >

        <div class="loading">
            Loading mechanics...
        </div>

    </div>


</main>


<script src="js/mechanics.js"></script>


<script>

(function () {

    "use strict";


    const box =
        document.getElementById("mechanics");

    const search =
        document.getElementById("search");

    const count =
        document.getElementById("count");


    const tabs = {

        colors:
            document.getElementById("colorsTab"),

        materials:
            document.getElementById("materialsTab"),

        all:
            document.getElementById("allTab")

    };


    let mode = "colors";


    /*
     * mechanics.js provides:
     *
     * mechanics
     * materials
     * mechanicsData
     *
     * We use mechanicsData here so this page
     * has one consistent source of data.
     */

    if (
        typeof mechanicsData === "undefined" ||
        !mechanicsData ||
        !Array.isArray(mechanicsData.colors) ||
        !Array.isArray(mechanicsData.materials)
    ) {

        box.innerHTML = `
            <div class="error">

                <strong>
                    Could not load mechanics data.
                </strong>

                <br><br>

                Make sure
                <code>mechanics.js</code>
                is in the same folder as this page.

            </div>
        `;

        return;

    }


    function escapeHTML(value) {

        return String(value ?? "")

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }


    function searchable(item) {

        const values = [

            item.name,
            item.theme,
            item.description,
            item.high,
            item.middle,
            item.low,
            item.checker,
            item.notes

        ];


        if (Array.isArray(item.variants)) {

            item.variants.forEach(
                variant => {

                    values.push(

                        variant.name,
                        variant.theme,
                        variant.description,
                        variant.high,
                        variant.middle,
                        variant.low,
                        variant.checker,
                        variant.notes

                    );

                }
            );

        }


        return values

            .filter(Boolean)

            .join(" ")

            .toLowerCase();

    }


    function heightBlock(label, value) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {

            return "";

        }


        return `

            <div class="height">

                <strong>
                    ${escapeHTML(label)}
                </strong>

                ${escapeHTML(value)}

            </div>

        `;

    }


    function colorCard(item) {

        return `

            <article class="mechanic-card">


                <div class="mechanic-header">

                    <span
                        class="swatch"
                        style="
                            background:
                                ${escapeHTML(
                                    item.color || "#333333"
                                )};
                        "
                    ></span>


                    <div>

                        <h2>
                            ${escapeHTML(item.name)}
                        </h2>


                        ${
                            item.theme
                                ? `
                                    <p class="theme">
                                        ${escapeHTML(
                                            item.theme
                                        )}
                                    </p>
                                `
                                : ""
                        }

                    </div>

                </div>


                <div class="mechanic-body">

                    ${heightBlock(
                        "High",
                        item.high
                    )}

                    ${heightBlock(
                        "Middle",
                        item.middle
                    )}

                    ${heightBlock(
                        "Low",
                        item.low
                    )}

                    ${heightBlock(
                        "Checker",
                        item.checker
                    )}

                </div>


            </article>

        `;

    }


    function materialCard(item) {

        const variants =
            Array.isArray(item.variants)
                ? item.variants
                : [];


        return `

            <article class="mechanic-card">


                <div class="mechanic-header">

                    <div>

                        <h2>
                            ${escapeHTML(item.name)}
                        </h2>


                        <p class="theme">
                            ${escapeHTML(
                                item.theme || "Material"
                            )}
                        </p>


                        <span class="material-tag">
                            Material
                        </span>

                    </div>

                </div>


                <div class="mechanic-body">


                    ${
                        item.description
                            ? `
                                <p
                                    class="material-description"
                                >
                                    ${escapeHTML(
                                        item.description
                                    )}
                                </p>
                            `
                            : ""
                    }


                    ${heightBlock(
                        "High",
                        item.high
                    )}

                    ${heightBlock(
                        "Middle",
                        item.middle
                    )}

                    ${heightBlock(
                        "Low",
                        item.low
                    )}


                    ${
                        item.checker &&
                        item.checker !== "N/A"
                            ? heightBlock(
                                "Checker",
                                item.checker
                            )
                            : ""
                    }


                    ${
                        item.notes
                            ? `
                                <div
                                    class="material-notes"
                                >

                                    <strong>
                                        Notes:
                                    </strong>

                                    ${escapeHTML(
                                        item.notes
                                    )}

                                </div>
                            `
                            : ""
                    }


                    ${
                        variants.length
                            ? variants
                                .map(
                                    renderVariant
                                )
                                .join("")
                            : ""
                    }


                </div>


            </article>

        `;

    }


    function renderVariant(variant) {

        return `

            <div class="variant">


                <div class="mechanic-header">


                    <span
                        class="swatch"
                        style="
                            background:
                                ${escapeHTML(
                                    variant.color ||
                                    "#333333"
                                )};
                        "
                    ></span>


                    <div>

                        <h3>
                            ${escapeHTML(
                                variant.name
                            )}
                        </h3>


                        ${
                            variant.theme
                                ? `
                                    <p class="theme">
                                        ${escapeHTML(
                                            variant.theme
                                        )}
                                    </p>
                                `
                                : ""
                        }

                    </div>


                </div>


                ${heightBlock(
                    "High",
                    variant.high
                )}

                ${heightBlock(
                    "Middle",
                    variant.middle
                )}

                ${heightBlock(
                    "Low",
                    variant.low
                )}


                ${
                    variant.checker &&
                    variant.checker !== "N/A"
                        ? heightBlock(
                            "Checker",
                            variant.checker
                        )
                        : ""
                }


                ${
                    variant.notes
                        ? `
                            <div
                                class="material-notes"
                            >

                                <strong>
                                    Notes:
                                </strong>

                                ${escapeHTML(
                                    variant.notes
                                )}

                            </div>
                        `
                        : ""
                }


            </div>

        `;

    }


    function render() {

        const query =
            search.value
                .trim()
                .toLowerCase();


        let source = [];


        if (
            mode === "colors" ||
            mode === "all"
        ) {

            source.push(

                ...mechanicsData.colors.map(
                    item => ({
                        ...item,
                        type: "color"
                    })
                )

            );

        }


        if (
            mode === "materials" ||
            mode === "all"
        ) {

            source.push(

                ...mechanicsData.materials.map(
                    item => ({
                        ...item,
                        type: "material"
                    })
                )

            );

        }


        const filtered =
            source.filter(
                item =>
                    !query ||
                    searchable(item)
                        .includes(query)
            );


        count.textContent =
            `${filtered.length} result${
                filtered.length === 1
                    ? ""
                    : "s"
            }`;


        if (!filtered.length) {

            box.innerHTML =
                `
                    <div class="empty">
                        No mechanics found.
                    </div>
                `;

            return;

        }


        box.innerHTML =
            filtered

                .map(
                    item =>
                        item.type === "color"
                            ? colorCard(item)
                            : materialCard(item)
                )

                .join("");

    }


    function setMode(nextMode) {

        mode = nextMode;


        Object.entries(tabs).forEach(
            ([key, button]) => {

                button.classList.toggle(
                    "active",
                    key === mode
                );

            }
        );


        render();

    }


    tabs.colors.addEventListener(
        "click",
        () => setMode("colors")
    );


    tabs.materials.addEventListener(
        "click",
        () => setMode("materials")
    );


    tabs.all.addEventListener(
        "click",
        () => setMode("all")
    );


    search.addEventListener(
        "input",
        render
    );


    render();


})();

</script>


</body>

</html>
