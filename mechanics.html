<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mechanics - Linglox Companion</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .intro {
            margin-bottom: 30px;
        }

        .intro h2 {
            margin-bottom: 8px;
        }

        .intro p {
            color: #afc4c9;
        }

        .search-box {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #101820;
            color: white;
            font-size: 16px;
        }

        .mechanics {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 18px;
        }

        .mechanic {
            display: block;

            background: #17252b;

            border: 1px solid #29454d;

            border-radius: 12px;

            padding: 22px;

            color: white;

            text-decoration: none;

            transition:
                transform 0.15s,
                border-color 0.15s,
                background 0.15s;
        }

        .mechanic:hover {
            transform: translateY(-2px);

            border-color: #3b8190;

            background: #1b3037;
        }

        .color-preview {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            margin-bottom: 16px;
        }

        .mechanic h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        .mechanic p {
            margin: 0;
            color: #afc4c9;
            line-height: 1.5;
        }

        .hex {
            margin-top: 10px;
            color: #8ed8e5;
            font-size: 14px;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #a8bcc1;
        }

    </style>

</head>


<body>


<header>

    <h1>
        Mechanics
    </h1>

    <p>
        Explore the mechanics of Linglox blocks
    </p>

</header>


<main>


    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <div class="intro">

        <h2>
            Block Mechanics
        </h2>

        <p>
            Browse the mechanics associated
            with each Linglox block color.
        </p>

    </div>


    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search colors or mechanics..."
            autocomplete="off"
        >

    </div>


    <div
        id="mechanics"
        class="mechanics"
    >

        <div class="loading">
            Loading mechanics...
        </div>

    </div>


</main>


<script src="mechanics-data.js"></script>


<script>


    const box =
        document.getElementById(
            "mechanics"
        );


    const search =
        document.getElementById(
            "search"
        );


    function displayMechanics(
        list
    ) {

        if (!list.length) {

            box.innerHTML =

                `<div class="empty">

                    No mechanics found.

                </div>`;

            return;

        }


        box.innerHTML =

            list
                .map(
                    mechanic => `

                        <a
                            class="mechanic"
                            href="mechanic-view.html?name=${encodeURIComponent(
                                mechanic.name
                            )}"
                        >

                            <div
                                class="color-preview"
                                style="background:${escapeHTML(
                                    mechanic.hex ||
                                    "#3b8190"
                                )}"
                            ></div>

                            <h2>
                                ${escapeHTML(
                                    mechanic.name
                                )}
                            </h2>

                            <p>
                                ${escapeHTML(
                                    mechanic.theme
                                )}
                            </p>

                            ${
                                mechanic.hex
                                ? `
                                    <div class="hex">
                                        ${escapeHTML(
                                            mechanic.hex
                                        )}
                                    </div>
                                `
                                : ""
                            }

                        </a>

                    `
                )
                .join("");

    }


    search.addEventListener(
        "input",
        function() {

            const query =
                this.value
                    .trim()
                    .toLowerCase();


            if (!query) {

                displayMechanics(
                    mechanics
                );

                return;

            }


            const filtered =
                mechanics.filter(
                    mechanic => {

                        const searchable =
                            [
                                mechanic.name,
                                mechanic.hex,
                                mechanic.theme,
                                mechanic.high,
                                mechanic.middle,
                                mechanic.low,
                                mechanic.checker,
                                mechanic.notes
                            ]
                                .filter(Boolean)
                                .join(" ")
                                .toLowerCase();


                        return searchable.includes(
                            query
                        );

                    }
                );


            displayMechanics(
                filtered
            );

        }
    );


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    displayMechanics(
        mechanics
    );


</script>


</body>

</html>
