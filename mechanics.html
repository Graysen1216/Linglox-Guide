<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mechanics - Linglox Companion</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }


        header {
            padding: 70px 20px;
            background: #183b45;
            text-align: center;
        }


        h1 {
            font-size: 52px;
            margin: 0 0 10px;
        }


        header p {
            font-size: 20px;
            color: #c7d8dc;
            margin: 0;
        }


        main {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }


        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #9fb5ba;
            text-decoration: none;
            font-size: 15px;
        }


        .back:hover {
            color: white;
        }


        .intro {
            text-align: center;
            margin-bottom: 30px;
        }


        .intro h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }


        .intro p {
            color: #c7d8dc;
            font-size: 18px;
        }


        .mechanics-search {
            max-width: 700px;
            margin: 0 auto 30px;
        }


        .mechanics-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px 18px;
            border-radius: 10px;
            border: 1px solid #29454d;
            background: #17252b;
            color: white;
            font-size: 17px;
            outline: none;
        }


        .mechanics-search input:focus {
            border-color: #3b8190;
        }


        .mechanics-search input::placeholder {
            color: #8fa7ad;
        }


        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }


        .tab {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #2d6875;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }


        .tab:hover {
            background: #3b8190;
        }


        .tab.active {
            background: #3b8190;
        }


        .mechanic-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 20px;
        }


        .mechanic-card {
            background: #17252b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #29454d;
        }


        .mechanic-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }


        .mechanic-header h2 {
            margin: 0;
            font-size: 22px;
        }


        .mechanic-header h3 {
            margin: 0;
            font-size: 19px;
        }


        .swatch {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.25);
            flex: 0 0 auto;
        }


        .theme {
            margin-top: 5px;
            color: #9fb5ba;
            font-size: 14px;
        }


        .height {
            margin-top: 12px;
            padding: 14px;
            background: #101820;
            border: 1px solid #29454d;
            border-radius: 8px;
        }


        .height strong {
            display: block;
            margin-bottom: 6px;
            color: #c7d8dc;
        }


        .height div {
            color: #afc4c9;
            line-height: 1.5;
        }


        .description {
            color: #afc4c9;
            line-height: 1.5;
            margin-bottom: 14px;
        }


        .material-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #29454d;
            color: #c7d8dc;
            font-size: 12px;
            margin-bottom: 15px;
        }


        .variant {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #29454d;
        }


        .variant .mechanic-header {
            margin-bottom: 14px;
        }


        .notes {
            margin-top: 15px;
            color: #afc4c9;
            line-height: 1.5;
        }


        .notes strong {
            color: #c7d8dc;
        }


        .empty {
            grid-column: 1 / -1;
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #9fb5ba;
        }


        @media (max-width: 600px) {

            header {
                padding: 40px 15px;
            }


            h1 {
                font-size: 36px;
            }


            header p {
                font-size: 17px;
            }


            main {
                padding: 30px 15px;
            }


            .intro h2 {
                font-size: 27px;
            }


            .intro p {
                font-size: 16px;
            }


            .mechanics-search {
                margin-bottom: 25px;
            }


            .mechanic-grid {
                grid-template-columns: 1fr;
            }


            .mechanic-card {
                padding: 21px;
            }


            .tab {
                min-height: 44px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        Mechanics
    </h1>

    <p>
        Explore the mechanics and materials of Linglox.
    </p>

</header>


<main>


    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <section class="intro">

        <h2>
            Linglox Mechanics
        </h2>

        <p>
            Learn how Linglox's colors and materials
            affect prompts and puzzles.
        </p>

    </section>


    <section class="mechanics-search">

        <input
            id="search"
            type="text"
            placeholder="Search mechanics and materials..."
            autocomplete="off"
        >

    </section>


    <div class="tabs">

        <button
            class="tab active"
            data-tab="colors"
        >
            Colors
        </button>


        <button
            class="tab"
            data-tab="materials"
        >
            Materials
        </button>

    </div>


    <section
        id="mechanics"
        class="mechanic-grid"
    >

        <div class="empty">
            Loading mechanics...
        </div>

    </section>


</main>


<script src="js/mechanics.js"></script>


<script>

(function () {


    const box =
        document.getElementById(
            "mechanics"
        );


    const search =
        document.getElementById(
            "search"
        );


    const tabs =
        [
            ...document.querySelectorAll(
                ".tab"
            )
        ];


    let currentTab =
        "colors";


    function escapeHTML(value) {

        return String(
            value ?? ""
        )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function searchable(item) {

        const values = [

            item.name,
            item.theme,
            item.description,
            item.high,
            item.middle,
            item.low,
            item.checker,
            item.notes

        ];


        (item.variants || [])
            .forEach(
                v => {

                    values.push(
                        v.name,
                        v.theme,
                        v.high,
                        v.middle,
                        v.low,
                        v.description
                    );

                }
            );


        return values

            .filter(Boolean)

            .join(" ")

            .toLowerCase();

    }


    function heightBlock(
        label,
        value
    ) {

        if (!value) {
            return "";
        }


        return `

            <div class="height">

                <strong>
                    ${label}
                </strong>

                <div>
                    ${escapeHTML(value)}
                </div>

            </div>

        `;

    }


    function renderColor(item) {

        return `

            <article class="mechanic-card">


                <div class="mechanic-header">

                    <span
                        class="swatch"
                        style="background:${escapeHTML(
                            item.color || "#333"
                        )}"
                    ></span>


                    <div>

                        <h2>
                            ${escapeHTML(item.name)}
                        </h2>


                        ${
                            item.theme
                                ? `
                                    <div class="theme">
                                        ${escapeHTML(
                                            item.theme
                                        )}
                                    </div>
                                `
                                : ""
                        }

                    </div>

                </div>


                ${heightBlock(
                    "High",
                    item.high
                )}


                ${heightBlock(
                    "Middle",
                    item.middle
                )}


                ${heightBlock(
                    "Low",
                    item.low
                )}


                ${heightBlock(
                    "Checker",
                    item.checker
                )}


            </article>

        `;

    }


    function renderMaterial(item) {

        const variants =
            item.variants || [];


        return `

            <article class="mechanic-card">


                <span class="material-badge">
                    Material
                </span>


                <div class="mechanic-header">

                    <div>

                        <h2>
                            ${escapeHTML(
                                item.name
                            )}
                        </h2>


                        ${
                            item.theme
                                ? `
                                    <div class="theme">
                                        ${escapeHTML(
                                            item.theme
                                        )}
                                    </div>
                                `
                                : ""
                        }

                    </div>

                </div>


                ${
                    item.description
                        ? `
                            <div class="description">
                                ${escapeHTML(
                                    item.description
                                )}
                            </div>
                        `
                        : ""
                }


                ${heightBlock(
                    "High",
                    item.high
                )}


                ${heightBlock(
                    "Middle",
                    item.middle
                )}


                ${heightBlock(
                    "Low",
                    item.low
                )}


                ${
                    item.notes
                        ? `
                            <div class="notes">

                                <strong>
                                    Notes:
                                </strong>

                                ${escapeHTML(
                                    item.notes
                                )}

                            </div>
                        `
                        : ""
                }


                ${
                    variants
                        .map(
                            v => `

                                <div class="variant">


                                    <div class="mechanic-header">

                                        <span
                                            class="swatch"
                                            style="background:${escapeHTML(
                                                v.color || "#333"
                                            )}"
                                        ></span>


                                        <div>

                                            <h3>
                                                ${escapeHTML(
                                                    v.name
                                                )}
                                            </h3>

                                        </div>

                                    </div>


                                    ${heightBlock(
                                        "High",
                                        v.high
                                    )}


                                    ${heightBlock(
                                        "Middle",
                                        v.middle
                                    )}


                                    ${heightBlock(
                                        "Low",
                                        v.low
                                    )}


                                </div>

                            `
                        )
                        .join("")
                }


            </article>

        `;

    }


    function render() {


        const source =
            currentTab === "colors"
                ? mechanics
                : materials;


        const query =
            search.value
                .trim()
                .toLowerCase();


        const list =
            source.filter(
                item =>
                    !query ||
                    searchable(
                        item
                    ).includes(
                        query
                    )
            );


        if (!list.length) {

            box.innerHTML = `

                <div class="empty">

                    No matching
                    ${currentTab}
                    found.

                </div>

            `;

            return;

        }


        box.innerHTML =
            list

                .map(
                    currentTab === "colors"
                        ? renderColor
                        : renderMaterial
                )

                .join("");

    }


    tabs.forEach(
        tab => {

            tab.addEventListener(
                "click",
                () => {

                    tabs.forEach(
                        t =>
                            t.classList.remove(
                                "active"
                            )
                    );


                    tab.classList.add(
                        "active"
                    );


                    currentTab =
                        tab.dataset.tab;


                    search.value =
                        "";


                    render();

                }
            );

        }
    );


    search.addEventListener(
        "input",
        render
    );


    render();


})();

</script>


</body>

</html>
