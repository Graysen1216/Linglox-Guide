<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mechanics - Linglox Companion</title>

    <link
        rel="stylesheet"
        href="global.css"
    >

    <style>

        .intro {
            margin-bottom: 30px;
        }

        .intro h2 {
            margin-bottom: 8px;
        }

        .intro p {
            color: #afc4c9;
        }

        .search-box {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #101820;
            color: white;
            font-size: 16px;
        }

        .mechanics {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 18px;
        }

        .mechanic {
            display: block;

            background: #17252b;

            border: 1px solid #29454d;

            border-radius: 12px;

            padding: 22px;

            color: white;

            text-decoration: none;

            transition:
                transform 0.15s,
                border-color 0.15s,
                background 0.15s;
        }

        .mechanic:hover {
            transform: translateY(-2px);

            border-color: #3b8190;

            background: #1b3037;
        }

        .color-preview {
            width: 100%;
            height: 12px;

            border-radius: 6px;

            margin-bottom: 18px;

            border: 1px solid rgba(
                255,
                255,
                255,
                0.2
            );

            box-sizing: border-box;
        }

        .mechanic h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        .theme {
            color: #8ed8e5;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .mechanic p {
            margin: 0;
            color: #afc4c9;
            line-height: 1.5;
        }

        .count {
            color: #8ed8e5;
            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #a8bcc1;
        }

        @media (max-width: 600px) {

            .mechanics {
                grid-template-columns: 1fr;
            }

            .search-box {
                padding: 16px;
            }

            .mechanic {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        Mechanics
    </h1>

    <p>
        Explore the mechanics of Linglox
    </p>

</header>


<main>


    <a
        class="back"
        href="index.html"
    >
        ← Back to homepage
    </a>


    <div class="intro">

        <h2>
            Linglox Mechanics
        </h2>

        <p>
            Browse the mechanics associated
            with each block color.
        </p>

    </div>


    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search mechanics..."
            autocomplete="off"
        >

    </div>


    <div
        id="count"
        class="count"
    >
        Loading...
    </div>


    <div
        id="mechanics"
        class="mechanics"
    >

        <div class="empty">
            Loading mechanics...
        </div>

    </div>


</main>


<script src="js/mechanics.js"></script>


<script>

    const box =
        document.getElementById(
            "mechanics"
        );


    const count =
        document.getElementById(
            "count"
        );


    const search =
        document.getElementById(
            "search"
        );


    function displayMechanics(
        list
    ) {

        count.textContent =
            list.length +
            (
                list.length === 1
                ? " mechanic"
                : " mechanics"
            );


        if (!list.length) {

            box.innerHTML =

                `<div class="empty">

                    No mechanics found.

                </div>`;

            return;

        }


        box.innerHTML =

            list
                .map(
                    mechanic => `

                        <a
                            class="mechanic"
                            href="mechanic-view.html?name=${encodeURIComponent(
                                mechanic.name
                            )}"
                        >

                            <div
                                class="color-preview"
                                style="background:${mechanic.color};"
                            ></div>

                            <h2>
                                ${escapeHTML(
                                    mechanic.name
                                )}
                            </h2>

                            <div class="theme">
                                ${escapeHTML(
                                    mechanic.theme
                                )}
                            </div>

                            <p>
                                View High, Middle,
                                Low, and Checker
                                mechanics →
                            </p>

                        </a>

                    `
                )
                .join("");

    }


    search.addEventListener(
        "input",
        function() {

            const query =
                this.value
                    .trim()
                    .toLowerCase();


            if (!query) {

                displayMechanics(
                    mechanics
                );

                return;

            }


            const filtered =
                mechanics.filter(
                    mechanic =>
                        mechanic.name
                            .toLowerCase()
                            .includes(query) ||

                        mechanic.theme
                            .toLowerCase()
                            .includes(query) ||

                        mechanic.high
                            .toLowerCase()
                            .includes(query) ||

                        mechanic.middle
                            .toLowerCase()
                            .includes(query) ||

                        mechanic.low
                            .toLowerCase()
                            .includes(query)
                );


            displayMechanics(
                filtered
            );

        }
    );


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    displayMechanics(
        mechanics
    );

</script>


</body>

</html>
