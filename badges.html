<meta

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            overflow-x: hidden;
        }

        header {
            padding: 40px 20px;
            background: #183b45;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #c7d8dc;
            margin: 10px 0 0;
        }

        main {
            width: min(1100px, calc(100% - 40px));
            margin: auto;
            padding: 40px 0;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ed8e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .intro {
            margin-bottom: 30px;
        }

        .intro h2 {
            margin: 0 0 8px;
        }

        .intro p {
            color: #afc4c9;
            margin: 0;
        }

        .search-box {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            min-height: 48px;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #29454d;
            background: #101820;
            color: white;
            font-size: 16px;
        }

        .search-box input::placeholder {
            color: #8fa7ad;
        }

        .search-box input:focus {
            outline: 3px solid #8ed8e5;
            outline-offset: 2px;
            border-color: #3b8190;
        }

        .badges {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        min(260px, 100%),
                        1fr
                    )
                );
            gap: 18px;
        }

        .badge {
            display: block;
            padding: 22px;
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition:
                transform 0.15s,
                border-color 0.15s,
                background 0.15s;
        }

        .badge:hover {
            transform: translateY(-2px);
            border-color: #3b8190;
            background: #1b3037;
        }

        .badge:focus-visible {
            outline: 3px solid #8ed8e5;
            outline-offset: 3px;
        }

        .badge h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .badge p {
            margin: 0;
            color: #afc4c9;
            line-height: 1.5;
        }

        .loading,
        .empty {
            padding: 40px;
            text-align: center;
            color: #a8bcc1;
        }

        .error {
            padding: 20px;
            background: #3d2529;
            border: 1px solid #70454b;
            border-radius: 10px;
            color: #ffb0b0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 30px;
            }

            main {
                width: min(100% - 24px, 1100px);
                padding: 28px 0 35px;
            }

            .search-box {
                padding: 16px;
            }

            .badge {
                padding: 18px;
            }

            .loading,
            .empty {
                padding: 30px 18px;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            .badge {
                transition: none;
            }

        }

    </style>

</head>

    const sortedBadges =
        [...badges].sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        sensitivity: "base"
                    }
                )
        );


    async function loadBadges() {

        const box =
            document.getElementById(
                "badges"
            );


        const {
            data,
            error
        } =
        await supabaseClient
            .from("prompts")
            .select("badges");


        if (error) {

            box.innerHTML =
                `<div class="error">

                    Could not load badges.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>`;

            return;

        }


        displayBadges(
            sortedBadges
        );

    }


    function displayBadges(
        list
    ) {

        const box =
            document.getElementById(
                "badges"
            );


        if (!list.length) {

            box.innerHTML =
                `<div class="empty">
                    No badges found.
                </div>`;

            return;

        }


        box.innerHTML =
            list
                .map(
                    badge => `

                        <a
                            class="badge"
                            href="badge-view.html?name=${encodeURIComponent(
                                badge
                            )}"
                        >

                            <h2>
                                ${escapeHTML(
                                    badge
                                )}
                            </h2>

                            <p>
                                Browse prompts
                                associated with
                                this badge.
                            </p>

                        </a>

                    `
                )
                .join("");

    }


    document
        .getElementById(
            "search"
        )
        .addEventListener(
            "input",
            function() {

                const query =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    displayBadges(
                        sortedBadges
                    );

                    return;

                }


                const filtered =
                    sortedBadges.filter(
                        badge =>
                            badge
                                .toLowerCase()
                                .includes(
                                    query
                                )
                    );


                displayBadges(
                    filtered
                );

            }
        );


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }
