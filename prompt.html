<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt - Linglox Companion</title>

    <link
        rel="stylesheet"
        href="global.css"
    >

    <style>

        /*
         * Page-specific styles
         */

        main {
            max-width: 850px;
        }


        .box {
            background: #17252b;
            border: 1px solid #29454d;
            border-radius: 12px;
            padding: clamp(20px, 5vw, 30px);
        }


        .prompt-title {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: clamp(30px, 7vw, 42px);
            line-height: 1.15;
            overflow-wrap: anywhere;
        }


        .answer-label {
            margin-bottom: 8px;
            font-weight: bold;
        }


        /*
         * Spoiler Shield
         */

        .spoiler {

            display: inline-block;

            max-width: 100%;

            background: #080c0e;

            color: transparent;

            border-radius: 7px;

            padding: 10px 15px;

            cursor: pointer;

            user-select: none;

            overflow-wrap: anywhere;

            transition:
                background 0.15s,
                color 0.15s;

        }


        .spoiler:hover {
            background: #1d272b;
        }


        .spoiler.revealed {

            background: #29454d;

            color: white;

        }


        .spoiler-hint {

            color: #83999e;

            font-size: 13px;

            margin-top: 8px;

        }


        /*
         * Prompt metadata
         */

        .metadata {

            margin-top: 30px;

            line-height: 1.9;

            color: #b7c9cd;

        }


        .label {

            color: white;

            font-weight: bold;

        }


        .verified {

            color: #9be7b0;

            font-weight: bold;

        }


        .timestamps {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #29454d;

            color: #83999e;

            font-size: 13px;

            line-height: 1.8;

        }


        @media (max-width: 600px) {

            .box {
                padding: 20px;
            }


            .prompt-title {
                margin-bottom: 20px;
            }


            .metadata {
                margin-top: 25px;
                line-height: 1.8;
            }


            .spoiler {
                max-width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        Linglox Companion
    </h1>

    <p>
        Prompt Database
    </p>

</header>


<main>


    <a
        class="back"
        href="database.html"
    >
        ← Back to Prompt Database
    </a>


    <div
        id="content"
        class="box"
    >

        <div class="loading">
            Loading prompt...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    /* =========================================
       SUPABASE
       ========================================= */


    const SUPABASE_URL =
        "https://njjqjvsoydazatafclwc.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_-ro-MLRQ47X2bYtPRZtrng_Kp17EZfi";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    const content =
        document.getElementById(
            "content"
        );


    /* =========================================
       GET PROMPT ID
       ========================================= */


    const params =
        new URLSearchParams(
            window.location.search
        );


    const promptId =
        params.get(
            "id"
        );


    /* =========================================
       FORMAT DATE
       ========================================= */


    function formatDate(
        value
    ) {

        if (!value) {

            return "Unknown";

        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Unknown";

        }


        return date.toLocaleString(
            undefined,
            {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
            }
        );

    }


    /* =========================================
       LOAD PROMPT
       ========================================= */


    async function loadPrompt() {

        if (!promptId) {

            showError(
                "No prompt was specified."
            );

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient

            .from("prompts")

            .select("*")

            .eq(
                "id",
                promptId
            )

            .maybeSingle();


        if (error) {

            showError(
                error.message
            );

            return;

        }


        if (!data) {

            showError(
                "We couldn't find that prompt in the database."
            );

            return;

        }


        displayPrompt(
            data
        );

    }


    /* =========================================
       DISPLAY PROMPT
       ========================================= */


    function displayPrompt(
        prompt
    ) {

        const areas =
            (prompt.areas || [])
                .join(", ") ||
            "—";


        const badges =
            (prompt.badges || [])
                .join(", ") ||
            "—";


        content.innerHTML = `

            <h1 class="prompt-title">

                ${escapeHTML(
                    prompt.prompt
                )}

            </h1>


            <div class="answer-label">

                Answer

            </div>


            <div
                class="spoiler"
                id="answerSpoiler"
                title="Click to reveal"
                role="button"
                tabindex="0"
                aria-label="Click to reveal answer"
                aria-expanded="false"
            >

                ${escapeHTML(
                    prompt.answer
                )}

            </div>


            <div class="spoiler-hint">

                Click the black box to reveal
                the answer.

            </div>


            <div class="metadata">


                <span class="label">
                    Dimension:
                </span>

                ${escapeHTML(
                    prompt.dimension || "—"
                )}

                <br>


                <span class="label">
                    Area:
                </span>

                ${escapeHTML(
                    areas
                )}

                <br>


                <span class="label">
                    Badge:
                </span>

                ${escapeHTML(
                    badges
                )}

                <br>


                <span class="label">
                    Color:
                </span>

                ${escapeHTML(
                    prompt.color || "—"
                )}

                <br>


                <span class="label">
                    Height:
                </span>

                ${escapeHTML(
                    prompt.height || "—"
                )}

                <br>


                <span class="label">
                    Mechanic:
                </span>

                ${escapeHTML(
                    prompt.mechanic || "—"
                )}

                <br>


                <span class="label">
                    Verification:
                </span>

                ${
                    prompt.verified

                    ?

                    `<span class="verified">
                        ✓ Verified
                    </span>`

                    :

                    "Not verified"

                }


                <br>


                <span class="label">
                    Source:
                </span>

                ${escapeHTML(
                    prompt.source ||
                    "None listed"
                )}

                <br>


                <span class="label">
                    Notes:
                </span>

                ${escapeHTML(
                    prompt.notes || "—"
                )}


                ${
                    prompt.evidence

                    ?

                    `

                    <br>

                    <span class="label">
                        Evidence:
                    </span>

                    <a
                        href="${escapeHTML(
                            prompt.evidence
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View evidence
                    </a>

                    `

                    :

                    ""

                }


            </div>


            <div class="timestamps">


                <strong>
                    Created:
                </strong>

                ${formatDate(
                    prompt.created_at
                )}


                <br>


                <strong>
                    Last updated:
                </strong>

                ${formatDate(
                    prompt.updated_at
                )}


            </div>

        `;


        const spoiler =
            document.getElementById(
                "answerSpoiler"
            );


        function toggleSpoiler() {

            const revealed =
                spoiler.classList.toggle(
                    "revealed"
                );


            spoiler.setAttribute(
                "aria-expanded",
                revealed
                    ? "true"
                    : "false"
            );

        }


        spoiler.addEventListener(
            "click",
            toggleSpoiler
        );


        spoiler.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    toggleSpoiler();

                }

            }
        );

    }


    /* =========================================
       ERROR
       ========================================= */


    function showError(
        message
    ) {

        content.innerHTML = `

            <div class="error">

                <h2>
                    Prompt not found
                </h2>

                <p>
                    ${escapeHTML(
                        message
                    )}
                </p>

            </div>

        `;

    }


    /* =========================================
       HTML ESCAPING
       ========================================= */


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       START
       ========================================= */


    loadPrompt();


</script>


</body>

</html>
